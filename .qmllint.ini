[General]
DisableDefaultImports=false
# 警告基线。当前仅剩 MissingProperty（组件内 JS 字面量对象的属性，qmllint 静态分析推不出）。
# 纪律：只减不增。修掉一条就把这个数调小；写新组件若触发新警告，CI 会红。
MaxWarnings=13

[Warnings]
# ── 阻塞级 ──────────────────────────────────────────────
# 出现即代表代码坏了：类型解析不到、覆盖基类属性（静默失效）、
# 给只读属性赋值、Layout 与 anchors 冲突等。一律当错误处理，不许合入。
ImportFailure=error
MissingType=error
UnresolvedType=error
UnresolvedAlias=error
PropertyOverride=error
ReadOnlyProperty=error
NonListProperty=error
DuplicatePropertyBinding=error
InheritanceCycle=error
DuplicatedName=error
EnumsAreNotTypes=error
UncreatableType=error
Quick.Anchors=error
Quick.LayoutsPositioning=error
Quick.AttachedPropertyType=error

# ── 记录级 ──────────────────────────────────────────────
# UnqualifiedAccess 是纯粹的作用域写法风格（Qt 6.8 起才严格），
# 降为 info：日志里能看到，但不阻塞。等专门排期统一加 root. 前缀后再升级。
UnqualifiedAccess=info
UnusedImports=info
