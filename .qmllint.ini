[General]
DisableDefaultImports=false
# 警告基线：0。全库 QML 已清零。
# 纪律：任何新增警告都会让 CI 变红，必须先修再合入。
MaxWarnings=0

[Warnings]
# ── 为什么这里没有逐类别设 error ──────────────────────────
# error 级别是 Qt 6.9 才引入的；6.8 的 qmllint 只接受 disable / info / warning。
# 在 6.8 上写 `Xxx=error` 会被判为 "Invalid logging level"，qmllint 打印 usage 后
# exit 255 —— 门禁不但没拦住问题，反而让整条 lint 步骤假失败（2026-11-16 CI 踩到）。
#
# 正确的等效做法是 MaxWarnings=0：默认级别为 warning 的类别（类型解析失败、
# PropertyOverride、ReadOnlyProperty、DuplicatePropertyBinding、
# Quick.Anchors / Quick.LayoutsPositioning 冲突等）只要出现一条，退出码就非零。
# 既完全保留了「阻塞」语义，又不必按 Qt 版本维护两份配置。
#
# 这里不再有任何降级项 —— UnqualifiedAccess 已于 2026-11-16 清零并恢复为
# 阻塞级别。此文件保留注释是为了记住下面两条踩过的坑。

# ── UnqualifiedAccess 清零时踩到的两个认知误区 ────────────
#
# 误区一：「加了 pragma ComponentBehavior: Bound 之后 delegate 就看不到外层 id」。
#   不成立。Bound 的语义是「内联组件的 context 与外层绑定」，delegate 依旧能
#   访问 root / theme，只是 qmllint 现在能静态确认这些标识符来自外层作用域，
#   因而不再报 unqualified。ShadcnTable 的 44 条就是加一行 pragma 加几处
#   限定符解决的，并不需要把 root 拆成 required property 逐个传参。
#
# 误区二：「Q_INVOKABLE 函数调用只算普通表达式，不会建立绑定依赖」。
#   这一点是真的，而且会实实在在咬人：ShadcnTable 原来写
#       Repeater { model: root.model ? root.model.columnCount() : 0 }
#   columnCount() 没有 notify 信号，绑定首次求值时 columns 还没赋值 → 0，
#   之后无论怎么赋值都不会重算，表头永久空白。totalWidth 因为额外依赖了
#   root.width 才侥幸重算，掩盖了缺陷。修法是把模型状态抽成带 notify 的属性
#   （columnCount / revision），由 model 的信号驱动。凡是要读 C++ 的
#   Q_INVOKABLE 取数值做绑定，都要先确认通知源是什么。
#
# 唯一保留的 unqualified 是 tests/qml/tst_ShadcnSelect.qml 里的 TestCppModel：
# 它由 qmltests_main.cpp 用 setContextProperty 注入，不在任何 QML 作用域里，
# 没有 id 可以限定。那里用行内的 qmllint disable/enable unqualified 精确包住，
# 不用在全局配置里开例外 —— 全局降级会连带放过真正的问题。

# ── 误区三：「本地 qmllint 全绿就等于 CI 全绿」 ──────────
#   本地 Qt 6.11.1，CI Qt 6.8.3，两边不是同一个 qmllint。删掉
#   UnqualifiedAccess 的全局降级后，ShadcnTextarea 里的 onTextEdited 立刻
#   在 CI 上冒出来：
#       no matching signal found for handler "onTextEdited" [unqualified]
#   TextEdit 的 textEdited 信号是 Qt 6.9 才加的（qmltypes 里
#   revision 1545 = 6*256+9；TextInput 的那份是 521，早得多）。6.8 上压根
#   没有这个信号，所以这不只是 lint 噪音 —— 运行时 handler 也连不上，
#   textEdited 是个永远不发的死信号。
#
#   纪律：引用 QtQuick 的信号 / 方法 / 属性前，先查
#       $QTDIR/qml/QtQuick/plugins.qmltypes
#   里的 revision，>= 1536（6.9）的一律不能用，项目 floor 是 6.5。
#   本地绿灯只能证明 6.11 能过，最低支持版本的行为必须靠 CI 守。

# UnusedImports 保持默认的阻塞级：未使用的 import 是纯垃圾，
# 删除零风险，没有理由容忍（2026-11-16 一次清掉 8 处）。
