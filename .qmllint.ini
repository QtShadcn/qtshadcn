[General]
DisableDefaultImports=false
# 警告基线：0。全库 QML 已清零。
# 纪律：任何新增警告都会让 CI 变红，必须先修再合入。
MaxWarnings=0

[Warnings]
# ── 为什么这里没有逐类别设 error ──────────────────────────
# error 级别是 Qt 6.9 才引入的；6.8 的 qmllint 只接受 disable / info / warning。
# 在 6.8 上写 `Xxx=error` 会被判为 "Invalid logging level"，qmllint 打印 usage 后
# exit 255 —— 门禁不但没拦住问题，反而让整条 lint 步骤假失败（2026-11-16 CI 踩到）。
#
# 正确的等效做法是 MaxWarnings=0：默认级别为 warning 的类别（类型解析失败、
# PropertyOverride、ReadOnlyProperty、DuplicatePropertyBinding、
# Quick.Anchors / Quick.LayoutsPositioning 冲突等）只要出现一条，退出码就非零。
# 既完全保留了「阻塞」语义，又不必按 Qt 版本维护两份配置。
#
# 需要「看一眼但不阻塞」的类别才在这里显式降级为 info。

# UnqualifiedAccess 降为 info：日志可见，但不阻塞。
#
# 剩余 46 条全部是同一种形态 —— **嵌套组件里访问外层 id**：
#   ShadcnTable 44（Repeater / TableView 的 delegate 里取 root、theme）
#   ShadcnCard   1（layer.effect 的值是 Component，MultiEffect 在其中取 root）
#   tests        1（context property TestCppModel，本就无 id 可限定）
#
# 已清的 20 条（DialogContent 16 / Alert 3 / Avatar 1）是「访问 root 自身属性
# 却没写 root.」的写法问题，加限定符即可，2026-11-16 已处理。
#
# 剩下的不能用限定符解决：qmllint 的建议是 `pragma ComponentBehavior: Bound`，
# 但加了之后 delegate 就看不到外层 id，必须把 root / theme 改成 required property
# 逐个传参，属于重构而非改标注。Table 的 QML 层目前没有测试覆盖（只有
# ShadcnTableModel 的 C++ 单测），为此重构复杂组件、收益仅是静态检查更严，
# 风险收益不划算。留待专门排期：先补 Table 的 QML 测试，再动结构。
UnqualifiedAccess=info

# UnusedImports 保持默认的阻塞级：未使用的 import 是纯垃圾，
# 删除零风险，没有理由容忍（2026-11-16 一次清掉 8 处）。
