[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pyqtshadcn"
version = "0.1.0"
description = "PyQt6 pure-Python adapter for the QtShadcn QML component library (no C++ build)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
authors = [{ name = "QtShadcn" }]
keywords = ["qt", "qml", "pyqt6", "shadcn", "ui", "components"]
dependencies = [
    "PyQt6>=6.10",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/QtShadcn/qtshadcn"
Repository = "https://github.com/QtShadcn/qtshadcn"

[tool.setuptools]
packages = ["pyqtshadcn"]
package-dir = { pyqtshadcn = "python" }

[tool.setuptools.package-data]
pyqtshadcn = [
    "QtShadcn/qmldir",
]

[tool.ruff]
indent-width = 4
line-length = 100
target-version = "py310"
extend-exclude = [
    "build*",
    "dist",
    "docs",
    "python/icons",
    "python/QtShadcn",
    "vendor",
]

[tool.ruff.lint]
select = [
    "B",
    "BLE",
    "E",
    "F",
    "I",
    "RUF",
    "S",
    "TC",
    "UP",
    "W",
]
ignore = [
    "E501",
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.format]
indent-style = "space"
line-ending = "lf"
quote-style = "double"
skip-magic-trailing-comma = false
