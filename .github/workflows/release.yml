name: Release

# 推送 v* 标签时构建两个 Python 包、离屏冒烟验证后发布到 PyPI。
# 发布使用 PyPI Trusted Publishing（OIDC），仓库内不保存 PyPI 凭证。
# 发布前需在 PyPI 对两个项目配置可信发布方：Owner=QtShadcn、
# Repository=qtshadcn、Workflow=Release（与本 workflow 的 name 一致）。

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # PyPI 可信发布（OIDC）必需

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 发布过程不打断

jobs:
  release:
    name: 构建、验证并发布
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install build tooling
        run: python -m pip install build

      - name: Build pyqtshadcn
        run: python -m build --outdir dist

      - name: Build pysideshadcn
        run: python python/build_pyside6.py --out-dir dist

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0

      - name: Verify wheels（离屏冒烟测试）
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install dist/*.whl
          python python/pyqt6/test/smoke_test.py
          python python/pyside6/test/smoke_test.py

      - name: Publish to PyPI（trusted publishing）
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          dist-path: dist
