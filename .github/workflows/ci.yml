name: CI

on:
  push:
    branches: [main]
    # 纯文档 / 技能 / Markdown 提交不必跑一轮 Qt 安装 + 完整编译
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - '**.md'

# 同一分支的新 push 自动取消上一个 run，避免排队占满 macOS runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# C++ 逻辑层单测 + 构建验证。
# CI 用 Qt 6.8.3（aqtinstall 暂无法装 6.11；本地 6.11.1 与 6.8.3 floor 兼容：本仓库
# find_package(Qt6) 未设最低版本，且未使用 6.9+ 专属 API）。
jobs:
  test:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          # 不指定 modules：aqt 桌面安装默认含 qtbase/qtdeclarative/qtquickcontrols2/
          # qtsvg/network，本项目 CMake 需要的组件均在其中（显式列模块名反而会被 aqt 拒）
          install-deps: false

      - name: Configure (tests on, examples off)
        run: cmake -S . -B build -DQTSHADCN_BUILD_TESTS=ON -DQTSHADCN_BUILD_EXAMPLES=OFF

      - name: Build
        # 必须给 -j 一个具体数字：裸 `-j` 是无限并行，make 会在几秒内把上百个编译
        # 任务（qmlcache 生成文件等）一次性提交，在 3 vCPU / 7 GB 的 macos-15 runner
        # 上互相抢核抢内存，进度百分比会长时间停住不动。按核数限制。
        run: |
          JOBS=$(sysctl -n hw.ncpu)
          echo "parallel jobs: $JOBS (cpu: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || uname -m))"
          cmake --build build --parallel "$JOBS"

      - name: Lint (QML gate)
        # .qmllint.ini 做分级：类型解析失败 / 覆盖基类属性 / 只读赋值 /
        # Layout-anchors 冲突等「真错误类」设为 error 直接失败；
        # 风格类（UnqualifiedAccess）降为 info 只记录，不阻塞。
        # 另有 MaxWarnings 基线：警告数只许减不许增。
        # -I build/src 指向构建产物，qmllint 才能解析 QtShadcn 模块。
        run: |
          COUNT=$(find src/qml tests/qml -name '*.qml' | wc -l | tr -d ' ')
          echo "linting $COUNT QML files"
          find src/qml tests/qml -name '*.qml' -print0 | xargs -0 qmllint -I build/src

      - name: Test
        env:
          # 纯 C++ 逻辑层单测（ThemeManager / IconRegistry / ShadcnTableModel），
          # 不需要真实显示服务器，用 offscreen 平台即可
          QT_QPA_PLATFORM: offscreen
        # 含 QML 组件测试（tests/qml/tst_*.qml，由 qmltests runner 驱动）：
        # 用例自身的 ENVIRONMENT 已固定 QT_QPA_PLATFORM=offscreen 与
        # QTSHADCN_SCREENSHOT=1（关掉 Card 的 GPU 阴影层，软件渲染下会空白）
        run: ctest --test-dir build --output-on-failure

      - name: Packaging smoke (find_package)
        # 安装导出是「别人能不能用这个库」的唯一入口，必须在 CI 里真跑一遍：
        # 装到本地前缀 → 用独立的消费方工程 find_package(QtShadcn) → 离屏实例化组件。
        # 只跑构建不跑安装的话，导出规则坏掉没人会发现。
        run: |
          PREFIX="$PWD/_install"
          cmake --install build --prefix "$PREFIX"
          cmake -S tests/consumer -B _consumer \
            -DCMAKE_PREFIX_PATH="$PREFIX;$QT_ROOT_DIR"
          cmake --build _consumer --parallel "$(sysctl -n hw.ncpu)"
          QT_QPA_PLATFORM=offscreen QTSHADCN_SCREENSHOT=1 \
            ctest --test-dir _consumer --output-on-failure
