name: CI

on:
  push:
    branches: [main]
    # 纯文档 / 技能 / Markdown 提交不必跑一轮 Qt 安装 + 完整编译
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - '**.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'skills/**'
      - '**.md'

# 同一分支的新 push 自动取消上一个 run，避免排队占满 macOS runner
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# C++ 逻辑层单测 + 构建验证。
# CI 用 Qt 6.8.3（aqtinstall 暂无法装 6.11；本地 6.11.1 与 6.8.3 floor 兼容：本仓库
# find_package(Qt6) 未设最低版本，且未使用 6.9+ 专属 API）。
jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - &install-lint-tools
        name: Install lint tools
        run: |
          uv sync --locked --extra dev --no-install-project \
            --no-install-package PyQt6 \
            --no-install-package PyQt6-Qt6 \
            --no-install-package PyQt6-sip

      - name: Check C++ formatting
        run: |
          find src examples tests -type f \( -name '*.cpp' -o -name '*.h' \) \
            -exec .venv/bin/clang-format --dry-run --Werror {} +

  test:
    needs: lint
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - *install-lint-tools

      - name: Configure clang-tidy
        run: |
          SDKROOT=$(xcrun --show-sdk-path)
          CXX_HEADERS="$SDKROOT/usr/include/c++/v1"
          if [ ! -d "$CXX_HEADERS" ]; then
            CXX_HEADERS="$(dirname "$(xcrun --find clang++)")/../include/c++/v1"
          fi
          # Header filters still report diagnostics in generated translation units.
          LINE_FILTER=$(git ls-files '*.cpp' '*.h' | jq -Rnc '[inputs | {name: .}]')
          echo "SDKROOT=$SDKROOT" >> "$GITHUB_ENV"
          echo "CXX_CLANG_TIDY=$PWD/.venv/bin/clang-tidy;--extra-arg=-isystem;--extra-arg=$CXX_HEADERS;--header-filter=$PWD/(src|examples|tests)/;--line-filter=$LINE_FILTER;--warnings-as-errors=*" >> "$GITHUB_ENV"

      - name: Install Qt 6.8.3
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          arch: clang_64
          # 不指定 modules：aqt 桌面安装默认含 qtbase/qtdeclarative/qtquickcontrols2/
          # qtsvg/network，本项目 CMake 需要的组件均在其中（显式列模块名反而会被 aqt 拒）
          install-deps: false

      - name: Configure (tests + examples on)
        # examples 必须一起构建：lint 步骤要检查它们的 QML（构建目录里的模块副本），
        # 且 showcase 是「组件是否真能渲染」的唯一验证入口。
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_CLANG_TIDY="$CXX_CLANG_TIDY" \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DQTSHADCN_BUILD_EXAMPLES=ON \
            -DQTSHADCN_BUILD_TESTS=ON

      - name: Build
        # 必须给 -j 一个具体数字：裸 `-j` 是无限并行，make 会在几秒内把上百个编译
        # 任务（qmlcache 生成文件等）一次性提交，在 3 vCPU / 7 GB 的 macos-15 runner
        # 上互相抢核抢内存，进度百分比会长时间停住不动。按核数限制。
        run: |
          JOBS=$(sysctl -n hw.ncpu)
          echo "parallel jobs: $JOBS (cpu: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || uname -m))"
          cmake --build build --parallel "$JOBS"

      - name: Lint (QML gate)
        # 阻塞机制是 .qmllint.ini 的 MaxWarnings=0：默认级别的任何 warning
        # （类型解析失败、PropertyOverride、只读赋值、Layout-anchors 冲突…）
        # 都让退出码非零。风格类 UnqualifiedAccess / UnusedImports 降为 info。
        #
        # 不要在这里或配置里用 `error` 级别：6.8 的 qmllint 只接受
        # disable / info / warning，写 error 会以 "Invalid logging level"
        # 打印 usage 后 exit 255，门禁变成假失败。
        #
        # -I build/src 指向构建产物，qmllint 才能解析 QtShadcn 模块。
        run: |
          echo "qmllint: $(qmllint --version)"
          COUNT=$(find src/qml tests/qml python/common/test -name '*.qml' | wc -l | tr -d ' ')
          echo "linting $COUNT QML files (lib + tests)"
          find src/qml tests/qml python/common/test -name '*.qml' -print0 \
            | xargs -0 qmllint -I build/src

          # examples 要 lint 构建目录里的模块副本，不能直接 lint 源文件：
          # Main.qml 引用同模块 pages/ 子目录里的类型，对源文件 qmllint 会报
          # "XxxPage was not found [import]"（showcase 一口气 36 条假警告）——
          # 它按源码树推断模块边界，而 qt_add_qml_module 把这些页面都注册进了
          # qmldir。构建副本带完整 qmldir，才能真正解析。实测同一份 Main.qml
          # 源文件 36 条 import 错误、构建副本 0 条。
          for mod in showcase ai-dashboard; do
            echo "linting examples/$mod (built module copy)"
            find "build/examples/$mod" -name '*.qml' -print0 \
              | xargs -0 qmllint -I build/src
          done

      - name: Test
        env:
          # 纯 C++ 逻辑层单测（ThemeManager / IconRegistry / ShadcnTableModel），
          # 不需要真实显示服务器，用 offscreen 平台即可
          QT_QPA_PLATFORM: offscreen
        # 含 QML 组件测试（tests/qml/tst_*.qml，由 qmltests runner 驱动）：
        # 用例自身的 ENVIRONMENT 已固定 QT_QPA_PLATFORM=offscreen 与
        # QTSHADCN_SCREENSHOT=1（关掉 Card 的 GPU 阴影层，软件渲染下会空白）
        run: ctest --test-dir build --output-on-failure

      - name: Packaging smoke (find_package)
        # 安装导出是「别人能不能用这个库」的唯一入口，必须在 CI 里真跑一遍：
        # 装到本地前缀 → 用独立的消费方工程 find_package(QtShadcn) → 离屏实例化组件。
        # 只跑构建不跑安装的话，导出规则坏掉没人会发现。
        run: |
          PREFIX="$PWD/_install"
          cmake --install build --prefix "$PREFIX"
          cmake -S tests/consumer -B _consumer \
            -DCMAKE_CXX_CLANG_TIDY="$CXX_CLANG_TIDY" \
            -DCMAKE_OSX_SYSROOT="$SDKROOT" \
            -DCMAKE_PREFIX_PATH="$PREFIX;$QT_ROOT_DIR"
          cmake --build _consumer --parallel "$(sysctl -n hw.ncpu)"
          QT_QPA_PLATFORM=offscreen QTSHADCN_SCREENSHOT=1 \
            ctest --test-dir _consumer --output-on-failure
