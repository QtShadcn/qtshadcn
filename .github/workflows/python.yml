name: Build and lint Python

on:
  push:
    branches: [main]
    paths: &python-paths
      - '.github/workflows/python.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'python/**'
      - 'examples/**/*.py'
      - 'src/qml/**'
      - 'src/assets/icons/**'
      - 'README*.md'
      - 'LICENSE'
      - 'THIRD-PARTY-NOTICES.md'
  pull_request:
    branches: [main]
    paths: *python-paths

permissions:
  contents: read

concurrency:
  group: python-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-slim
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Python
        uses: astral-sh/ruff-action@v4.1.0
        with:
          version-file: uv.lock

      - name: Format Python
        run: ruff format --check --extend-exclude '*.md'

  build:
    needs: lint
    runs-on: ubuntu-slim
    strategy:
      fail-fast: true
      matrix:
        package: [pyqtshadcn, pysideshadcn]
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
          - '3.14'
          - '3.15'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tools
        run: python -m pip install build

      - name: Build PyQt6 sdist and wheel
        if: matrix.package == 'pyqtshadcn'
        run: python -m build

      - name: Build PySide6 sdist and wheel
        if: matrix.package == 'pysideshadcn'
        run: python python/build_pyside6.py --out-dir dist

      - name: Install and compile wheel
        run: |
          python -m pip install --no-deps --target "$RUNNER_TEMP/package" dist/*.whl
          python -m compileall -q "$RUNNER_TEMP/package/${{ matrix.package }}"

      - name: Upload runtime wheel
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.package }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 1

  test-wheels:
    needs: build
    strategy:
      fail-fast: true
      matrix:
        package: [pyqtshadcn, pysideshadcn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.package }}
          path: dist

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libopengl0

      - name: Install wheel
        run: python -m pip install dist/*.whl

      - name: Check PyQt6 QML bindings
        if: matrix.package == 'pyqtshadcn'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python python/pyqt6/test/smoke_test.py

      - name: Check PySide6 QML bindings
        if: matrix.package == 'pysideshadcn'
        env:
          QT_QPA_PLATFORM: offscreen
        run: python python/pyside6/test/smoke_test.py
